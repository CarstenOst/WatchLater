services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: watchlater
      POSTGRES_PASSWORD: watchlater
      POSTGRES_DB: watchlater
    ports:
      - "5433:5432"
    volumes:
      - watchlater_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlater -d watchlater"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  watchlater_pgdata:
