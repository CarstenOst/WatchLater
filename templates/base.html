<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WatchLater{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="/static/push.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" hx-boost="true">
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-semibold text-lg tracking-tight">WatchLater</a>
      <div class="flex gap-4 text-sm">
        <a href="/" class="{% if active_nav == "home" %}text-white{% else %}text-slate-400 hover:text-white{% endif %}">Inbox</a>
        <a href="/done" class="{% if active_nav == "done" %}text-white{% else %}text-slate-400 hover:text-white{% endif %}">Done</a>
        <button id="enable-push" class="text-slate-400 hover:text-white hidden">Enable notifications</button>
      </div>
    </div>
  </nav>
  <main class="max-w-3xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
