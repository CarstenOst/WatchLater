<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WatchLater</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="./app.css">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script src="./db.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#/" class="font-semibold text-lg tracking-tight">WatchLater</a>
      <div class="flex gap-4 text-sm">
        <a id="nav-inbox" href="#/" class="text-white">Inbox</a>
        <a id="nav-done" href="#/done" class="text-slate-400 hover:text-white">Done</a>
        <button id="enable-notifications"
                class="text-slate-400 hover:text-white disabled:opacity-50 hidden">Enable notifications</button>
      </div>
    </div>
  </nav>
  <main id="app" class="max-w-3xl mx-auto px-4 py-6">
    <noscript>
      <p class="text-slate-500 text-center py-12">
        WatchLater needs JavaScript — everything runs and is stored locally in your browser.
      </p>
    </noscript>
  </main>
  <footer class="max-w-3xl mx-auto px-4 py-6 flex items-center justify-center gap-4 text-xs text-slate-600">
    <button id="export-btn" class="hover:text-slate-400">Export data</button>
    <button id="import-btn" class="hover:text-slate-400">Import data</button>
    <input id="import-file" type="file" accept=".json,application/json" class="hidden">
    <span id="app-version" title="Service worker version">–</span>
  </footer>
</body>
</html>
